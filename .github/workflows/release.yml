# Release: `gh release create vX.Y.Z --target main` creates the tag on GitHub and starts this
# workflow; the tag must match `__version__`. The workflow runs CI, checks the tag against the
# package version, builds once, publishes to TestPyPI, installs that release from TestPyPI with
# the packages it names and renders a small workbook with sheetpeek, then publishes the same
# files to PyPI.
#
# Publishing uses trusted publishing (OpenID Connect), so no token is stored. Configure on
# test.pypi.org and pypi.org a trusted publisher for owner `sheetmill`, repository
# `sheetmill`, workflow `release.yml`, environments `testpypi` and `pypi`. Give the GitHub
# environment `pypi` a required reviewer, so the PyPI step waits for a person to approve it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/sheetmill/__init__.py').read())[1])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/sheetmill/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v5
      - name: Install the release from TestPyPI and render a workbook
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv venv /tmp/env
          # Only sheetmill itself is taken from TestPyPI; the packages it installs, as its own
          # metadata declares them, come from PyPI.
          # TestPyPI's index can lag the upload by a minute.
          for attempt in 1 2 3 4 5 6; do
            uv pip install -p /tmp/env --no-cache --no-deps --index-url https://test.pypi.org/simple/ "sheetmill==${version}" && break
            sleep 20
          done
          /tmp/env/bin/python -I -c "from importlib.metadata import requires; print('\n'.join(r for r in requires('sheetmill') if 'extra ==' not in r))" > /tmp/requirements.txt
          cat /tmp/requirements.txt
          uv pip install -p /tmp/env -r /tmp/requirements.txt
          SHEETMILL_VERSION="${version}" /tmp/env/bin/python -I - <<'PY'
          import os, pathlib, tempfile
          import openpyxl, sheetmill, sheetpeek, xlformat
          assert sheetmill.__version__ == os.environ["SHEETMILL_VERSION"]
          assert xlformat.format_value(1234.5, "#,##0.00") == "1,234.50"
          path = pathlib.Path(tempfile.mkdtemp()) / "check.xlsx"
          wb = openpyxl.Workbook()
          wb.active["A1"] = 1234.5
          wb.active["A1"].number_format = "#,##0.00"
          wb.save(path)
          text = sheetpeek.render(path, "text")
          assert text == "1,234.50\n", repr(text)
          print(sheetmill.__version__, xlformat.__version__, sheetpeek.__version__, text, end="")
          PY

  pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sheetmill/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
