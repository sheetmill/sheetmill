name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check --strict dist/*
      # The wheel must install alone and pull in the packages it names.
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/wheel-env
          uv pip install -p /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -I -c "import sheetmill, xlformat; print(sheetmill.__version__, xlformat.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
